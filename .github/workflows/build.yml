name: Build and Release

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-macos:
    name: Test and Build macOS Preview
    runs-on: macos-latest
    env:
      QT_QPA_PLATFORM: offscreen
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - name: Install dependencies
        run: python -m pip install -r requirements.txt pyinstaller
      - name: Build native screen capture component
        run: python scripts/build_macos_capture.py
      - name: Run test suite
        run: python scripts/test_modules.py
      - name: Verify source startup
        run: python main.py --smoke-test --data-dir "${{ runner.temp }}/gamepadstudio-source-smoke"
      - name: Build app
        run: pyinstaller --noconfirm GamePadStudio.spec
      - name: Verify packaged startup
        run: dist/GamePadStudio.app/Contents/MacOS/GamePadStudio --smoke-test --data-dir "${{ runner.temp }}/gamepadstudio-package-smoke"
      - name: Package app with bundle symlinks
        run: ditto -c -k --sequesterRsrc --keepParent dist/GamePadStudio.app dist/GamePadStudio-macOS.zip
      - uses: actions/upload-artifact@v4
        with:
          name: GamePadStudio-macOS-preview
          path: dist/GamePadStudio-macOS.zip
          retention-days: 14
  build-windows:
    name: Build Windows x64 Executable
    runs-on: windows-latest
    env:
      QT_QPA_PLATFORM: offscreen
      SDL_VIDEODRIVER: dummy
      SDL_AUDIODRIVER: dummy
      PYGAME_HIDE_SUPPORT_PROMPT: "1"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Run test suite
        run: |
          python scripts/test_modules.py --jobs 2

      - name: Build executable with PyInstaller
        run: |
          pyinstaller --noconfirm GamePadStudio.spec

      - name: Package Windows distribution (.zip)
        shell: powershell
        run: |
          $DistDir = "dist\GamePadStudio"
          $ZipPath = "dist\GamePadStudio-Windows-x64.zip"
          Compress-Archive -Path "$DistDir\*" -DestinationPath $ZipPath -Force
          $Hash = (Get-FileHash -Algorithm SHA256 $ZipPath).Hash
          Set-Content -Path "dist\GamePadStudio-Windows-x64.zip.sha256" -Value "$Hash  GamePadStudio-Windows-x64.zip"
          Write-Host "Created $ZipPath with SHA256: $Hash"

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: GamePadStudio-Windows-x64
          path: |
            dist/GamePadStudio-Windows-x64.zip
            dist/GamePadStudio-Windows-x64.zip.sha256
          retention-days: 14

      - name: Publish to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/GamePadStudio-Windows-x64.zip
            dist/GamePadStudio-Windows-x64.zip.sha256
          draft: false
          prerelease: false
          generate_release_notes: true
