<svg viewBox="0 0 441 383" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="shell_grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2e2a27"/>
      <stop offset="100%" stop-color="#1f1c1a"/>
    </linearGradient>
    <linearGradient id="well_grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#181614"/>
      <stop offset="100%" stop-color="#23201d"/>
    </linearGradient>
  </defs>

  <g id="XboxController">
    <!-- Authentic Xbox Series X|S Taut Ergonomic Silhouette (No floating shoulder/trigger boxes) -->
    <path d="M 146 82
             L 295 82
             C 334 82, 366 102, 382 140
             C 396 174, 410 238, 410 286
             C 410 330, 388 356, 360 354
             C 336 352, 318 320, 300 292
             C 288 276, 272 274, 220.5 274
             C 169 274, 153 276, 141 292
             C 123 320, 105 352, 81 354
             C 53 356, 31 330, 31 286
             C 31 238, 45 174, 59 140
             C 75 102, 107 82, 146 82 Z"
          fill="url(#shell_grad)" stroke="#655f59" stroke-width="2.5" stroke-linejoin="round"/>

    <!-- Subtle Top Bevel Chamfer Line (Authentic Xbox Series Top Facet) -->
    <path d="M 136 86 L 305 86" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="1.5" stroke-linecap="round"/>

    <!-- Subtle Ergonomic Grip Contour Seams -->
    <path d="M 60 176 C 48 220, 44 268, 52 314" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2" stroke-linecap="round"/>
    <path d="M 381 176 C 393 220, 397 268, 389 314" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="2" stroke-linecap="round"/>

    <!-- Left Analog Stick (113, 160) -->
    <circle cx="113" cy="160" r="28" fill="url(#well_grad)" stroke="#44403c" stroke-width="2"/>
    <circle cx="113" cy="160" r="20" fill="#322e2b" stroke="#655f59" stroke-width="2"/>
    <circle cx="113" cy="160" r="12" fill="none" stroke="#1c1917" stroke-opacity="0.55" stroke-width="1.5"/>

    <!-- Right Analog Stick (278, 238) -->
    <circle cx="278" cy="238" r="28" fill="url(#well_grad)" stroke="#44403c" stroke-width="2"/>
    <circle cx="278" cy="238" r="20" fill="#322e2b" stroke="#655f59" stroke-width="2"/>
    <circle cx="278" cy="238" r="12" fill="none" stroke="#1c1917" stroke-opacity="0.55" stroke-width="1.5"/>

    <!-- Precision D-Pad Dish & Unified Cross (166, 238) -->
    <circle cx="166" cy="238" r="27" fill="url(#well_grad)" stroke="#3f3b37" stroke-width="1.8"/>
    <path d="M 161 216
             A 2 2 0 0 1 163 214 H 169 A 2 2 0 0 1 171 216
             V 231 H 186
             A 2 2 0 0 1 188 233 V 239 A 2 2 0 0 1 186 241
             H 171 V 256
             A 2 2 0 0 1 169 258 H 163 A 2 2 0 0 1 161 256
             V 241 H 146
             A 2 2 0 0 1 144 239 V 233 A 2 2 0 0 1 146 231
             H 161 Z"
          fill="#35312e" stroke="#57534e" stroke-width="1.5" stroke-linejoin="round"/>

    <!-- 4 Action Face Buttons -->
    <circle cx="329" cy="140" r="12" fill="#1c1917" stroke="#eab308" stroke-opacity="0.88" stroke-width="2"/>
    <circle cx="310" cy="162" r="12" fill="#1c1917" stroke="#3b82f6" stroke-opacity="0.88" stroke-width="2"/>
    <circle cx="348" cy="161" r="12" fill="#1c1917" stroke="#ef4444" stroke-opacity="0.88" stroke-width="2"/>
    <circle cx="330" cy="181" r="12" fill="#1c1917" stroke="#22c55e" stroke-opacity="0.88" stroke-width="2"/>

    <!-- Center System Buttons (Quiet recessed hardware styling) -->
    <circle cx="220.5" cy="125" r="12" fill="#23201d" stroke="#57534e" stroke-width="1.6"/>
    <circle cx="220.5" cy="125" r="5" fill="#3a3532"/>

    <circle cx="188" cy="162" r="6.5" fill="#23201d" stroke="#4e4945" stroke-width="1.4"/>
    <circle cx="253" cy="162" r="6.5" fill="#23201d" stroke="#4e4945" stroke-width="1.4"/>
    <rect x="214" y="184" width="13" height="7" rx="3.5" fill="#23201d" stroke="#4e4945" stroke-width="1.4"/>
  </g>
</svg>
