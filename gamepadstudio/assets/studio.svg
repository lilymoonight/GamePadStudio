<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <!-- Deep Anodized Squircle Tile -->
    <linearGradient id="tile_bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#262320"/>
      <stop offset="100%" stop-color="#141210"/>
    </linearGradient>

    <!-- Warm Titanium / Chalk Gamepad Body -->
    <linearGradient id="pad_surface" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#fbf9f5"/>
      <stop offset="100%" stop-color="#ded8ce"/>
    </linearGradient>

    <!-- TE Safety Orange Accent -->
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#ff6d3f"/>
      <stop offset="100%" stop-color="#ff5722"/>
    </linearGradient>
  </defs>

  <!-- 1. App Icon Squircle Base -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#tile_bg)" stroke="#3a3530" stroke-width="6"/>

  <!-- 2. Pure-Geometric Modern Gamepad (24x24 grid scaled by 17.0, centered at 256,256) -->
  <g transform="translate(52, 52) scale(17.0)">
    <!-- Drop Shadow Under Controller -->
    <path d="M17.32 5.55H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.966 2 14.8 2 16.35a2.9 2.9 0 0 0 2.9 2.9c1 0 1.55-.5 2.05-1.05l1.65-1.85A1.8 1.8 0 0 1 9.94 15.7h4.12a1.8 1.8 0 0 1 1.34.65l1.65 1.85c.5.55 1.05 1.05 2.05 1.05a2.9 2.9 0 0 0 2.9-2.9c0-1.55-.604-6.384-.685-7.058-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5.55z"
          fill="#000000" fill-opacity="0.40"/>

    <!-- Solid Sculpted Modern Controller Body -->
    <path d="M17.32 5H6.68a4 4 0 0 0-3.978 3.59c-.006.052-.01.101-.017.152C2.604 9.416 2 14.25 2 15.8a2.9 2.9 0 0 0 2.9 2.9c1 0 1.55-.5 2.05-1.05l1.65-1.85A1.8 1.8 0 0 1 9.94 15.15h4.12a1.8 1.8 0 0 1 1.34.65l1.65 1.85c.5.55 1.05 1.05 2.05 1.05a2.9 2.9 0 0 0 2.9-2.9c0-1.55-.604-6.384-.685-7.058-.007-.05-.011-.1-.017-.151A4 4 0 0 0 17.32 5z"
          fill="url(#pad_surface)"/>

    <!-- Left Wing: Precision D-Pad (+) -->
    <path d="M 6.0 10.3 H 9.5 M 7.75 8.55 V 12.05"
          fill="none" stroke="#181615" stroke-width="1.45" stroke-linecap="round"/>

    <!-- Right Wing: 4 Diamond Action Buttons (Primary Bottom Button in Safety Orange) -->
    <circle cx="16.25" cy="8.55" r="0.86" fill="#181615"/>
    <circle cx="18.0" cy="10.3" r="0.86" fill="#181615"/>
    <circle cx="14.5" cy="10.3" r="0.86" fill="#181615"/>
    <circle cx="16.25" cy="12.05" r="0.92" fill="url(#accent)"/>

    <!-- Center Top: Minimalist Studio Status Pill -->
    <rect x="10.85" y="6.85" width="2.3" height="0.62" rx="0.31" fill="url(#accent)"/>
  </g>
</svg>