  <path d="M 184 168 C 220 178 292 178 328 168 C 364 158 392 178 404 212 C 420 258 430 322 410 358 C 392 388 356 380 334 338 L 314 298 C 294 286 218 286 198 298 L 178 338 C 156 380 120 388 102 358 C 82 322 92 258 108 212 C 120 178 148 158 184 168 Z"
