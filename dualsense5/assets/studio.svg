  <!-- Touchpad Sensor Bar (Subtle top ridge) -->
  <path d="M 216 176 C 238 182 274 182 296 176" fill="none" stroke="#f5f2eb" stroke-width="7" stroke-linecap="round" opacity="0.80"/>

  <!-- TE Safety Orange Central Power / Telemetry Halo -->
  <circle cx="256" cy="226" r="28" fill="rgba(255, 87, 34, 0.20)"/>
  <circle cx="256" cy="226" r="18" fill="#141211" stroke="url(#accent)" stroke-width="6"/>
  <circle cx="256" cy="226" r="6" fill="#ff7043"/>

