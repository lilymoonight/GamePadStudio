  <!-- Precision Action Buttons (Right cluster) -->
  <circle cx="346" cy="220" r="7.5" fill="#f5f2eb"/>
  <circle cx="346" cy="264" r="7.5" fill="#f5f2eb"/>
  <circle cx="324" cy="242" r="7.5" fill="#f5f2eb"/>
  <circle cx="368" cy="242" r="7.5" fill="#f5f2eb"/>

  <!-- Dual Thumbsticks (Inset into body, crisp circles) -->
